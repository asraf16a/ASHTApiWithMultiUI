<div class="page-header">

    <div>

        <h2>

            <i class="bi bi-folder-plus text-primary"></i>

            Add Subcategory

        </h2>

        <p class="text-muted">

            Create a new subcategory

        </p>

    </div>

</div>

<div class="card shadow-sm">

    <div class="card-body">

        <form
            [formGroup]="subCategoryForm"
            (ngSubmit)="save()">

            <div class="mb-3">

                <label class="form-label">

                    Category

                </label>

                <select
                    class="form-select"
                    formControlName="categoryId">

                    <option [ngValue]="null">

                        Select Category

                    </option>

                    <option
                        *ngFor="let category of categories"
                        [value]="category.id">

                        {{category.name}}

                    </option>

                </select>

            </div>

            <div class="mb-3">

                <label class="form-label">

                    Subcategory Name

                </label>

                <input
                    type="text"
                    class="form-control"
                    formControlName="subCategoryName">

            </div>

            <hr>

            <div class="text-end">

                <button
                    type="button"
                    class="btn btn-secondary me-2"
                    (click)="cancel()">

                    <i class="bi bi-x-circle"></i>

                    Cancel

                </button>

                <button
                    class="btn btn-primary"
                    type="submit">

                    <i class="bi bi-check-circle"></i>

                    Save Subcategory

                </button>

            </div>

        </form>

    </div>

</div>
