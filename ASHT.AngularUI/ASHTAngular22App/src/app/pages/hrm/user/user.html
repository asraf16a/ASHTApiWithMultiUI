<div class="page-container">

    <!-- Header -->

    <div class="page-header">

        <div>

            <h2>

                <i class="bi bi-people-fill text-primary"></i>

                User Management

            </h2>

            <p class="text-muted">

                Manage system users

            </p>

        </div>

        <div>

            <button
                *ngIf="currentPage=='list'"
                class="btn btn-primary"
                (click)="addUser()">

                <i class="bi bi-plus-circle"></i>

                Add User

            </button>

            <button
                *ngIf="currentPage!='list'"
                class="btn btn-secondary"
                (click)="backToList()">

                <i class="bi bi-arrow-left"></i>

                Back

            </button>

        </div>

    </div>

    <!-- Summary -->

    <div
        class="row g-4 mb-4"
        *ngIf="currentPage=='list'">

        <div class="col-md-4">

            <div class="summary-card">

                <h6>Total Users</h6>

                <h2>{{totalUsers}}</h2>

            </div>

        </div>

        <div class="col-md-4">

            <div class="summary-card">

                <h6>Active Users</h6>

                <h2 class="text-success">

                    {{activeUsers}}

                </h2>

            </div>

        </div>

        <div class="col-md-4">

            <div class="summary-card">

                <h6>Inactive Users</h6>

                <h2 class="text-danger">

                    {{inactiveUsers}}

                </h2>

            </div>

        </div>

    </div>

    <!-- Content -->

    <div class="content-card">

        <app-user-list

            *ngIf="currentPage=='list'"

            (addClicked)="addUser()"

            (editClicked)="editUser($event)">

        </app-user-list>

        <app-add-user

            *ngIf="currentPage=='add'">

        </app-add-user>

        <app-edit-user

            *ngIf="currentPage=='edit'"

            [userId]="selectedUserId">

        </app-edit-user>

    </div>

</div>
