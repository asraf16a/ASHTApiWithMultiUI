<div class="add-role-wrapper">

  <h2 class="form-title">Add Role</h2>

  <form [formGroup]="roleForm" (ngSubmit)="save()">

    <div class="form-group">
      <label for="roleName">Role Name</label>
      <input
        id="roleName"
        type="text"
        formControlName="roleName"
        placeholder="Enter role name" />
      <div
        class="error-text"
        *ngIf="roleForm.get('roleName')?.invalid && roleForm.get('roleName')?.touched">
        Role name is required.
      </div>
    </div>

    <div class="form-group">
      <label for="description">Description</label>
      <textarea
        id="description"
        formControlName="description"
        placeholder="Enter description"
        rows="3">
      </textarea>
      <div
        class="error-text"
        *ngIf="roleForm.get('description')?.invalid && roleForm.get('description')?.touched">
        Description is required.
      </div>
    </div>

    <div class="form-group checkbox-group">
      <label>
        <input type="checkbox" formControlName="isActive" />
        Active
      </label>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn-save">Save</button>
      <button type="button" class="btn-cancel" (click)="cancel()">Cancel</button>
    </div>

  </form>

</div>
