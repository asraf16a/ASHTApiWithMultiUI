<div class="page-header">

    <div>

        <h2>

            <i class="bi bi-pencil-square text-primary"></i>

            Edit Prescription Details

        </h2>

        <p class="text-muted">

            Update prescription information

        </p>

    </div>

</div>

<div class="card shadow-sm">

    <div class="card-body">

        <form
            [formGroup]="prescriptionForm"
            (ngSubmit)="update()">

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label class="form-label">

                        Medicine Name

                    </label>

                    <input
                        type="text"
                        class="form-control"
                        formControlName="medicineName">

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">

                        Dosage

                    </label>

                    <input
                        type="text"
                        class="form-control"
                        formControlName="dosage">

                </div>

            </div>

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label class="form-label">

                        Start Date

                    </label>

                    <input
                        type="date"
                        class="form-control"
                        formControlName="startDate">

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">

                        End Date

                    </label>

                    <input
                        type="date"
                        class="form-control"
                        formControlName="endDate">

                </div>

            </div>

            <div class="mb-3">

                <label class="form-label">

                    Notes

                </label>

                <textarea
                    rows="4"
                    class="form-control"
                    formControlName="notes">

                </textarea>

            </div>

            <hr>

            <div class="text-end">

                <button
                    type="button"
                    class="btn btn-secondary me-2"
                    (click)="cancel()">

                    <i class="bi bi-arrow-left-circle"></i>

                    Back

                </button>

                <button
                    type="submit"
                    class="btn btn-primary">

                    <i class="bi bi-check-circle"></i>

                    Update Prescription

                </button>

            </div>

        </form>

    </div>

</div>
