<div class="page-header">

    <div>

        <h2>

            <i class="bi bi-capsule-pill text-primary"></i>

            Prescription Details

        </h2>

        <p class="text-muted">

            Manage prescription medicines

        </p>

    </div>

    <button
        class="btn btn-primary"
        (click)="addPrescription()">

        <i class="bi bi-plus-circle"></i>

        Add Prescription

    </button>

</div>

<div class="row g-4 mb-4">

    <div class="col-md-4">

        <div class="card stats-card">

            <div class="card-body">

                <h6>Total Prescriptions</h6>

                <h2>{{totalPrescriptions}}</h2>

            </div>

        </div>

    </div>

</div>

<div class="card shadow-sm">

    <div class="card-body">

        <div class="mb-3">

            <input
                class="form-control"
                placeholder="Search medicine..."
                [(ngModel)]="searchText">

        </div>

        <div class="table-responsive">

            <table class="table table-hover align-middle">

                <thead class="table-light">

                    <tr>

                        <th>#</th>

                        <th>Medicine Name</th>

                        <th>Dosage</th>

                        <th>Start Date</th>

                        <th>End Date</th>

                        <th>Notes</th>

                        <th width="140">

                            Action

                        </th>

                    </tr>

                </thead>

                <tbody>

                    <tr *ngFor="let item of prescriptions">

                        <td>

                            {{item.id}}

                        </td>

                        <td>

                            <strong>

                                {{item.medicineName}}

                            </strong>

                        </td>

                        <td>

                            {{item.dosage}}

                        </td>

                        <td>

                            {{item.startDate | date:'dd-MMM-yyyy'}}

                        </td>

                        <td>

                            {{item.endDate | date:'dd-MMM-yyyy'}}

                        </td>

                        <td>

                            {{item.notes}}

                        </td>

                        <td>

                            <button
                                class="btn btn-outline-primary btn-sm me-2"
                                (click)="editPrescription(item)">

                                <i class="bi bi-pencil-square"></i>

                            </button>

                            <button
                                class="btn btn-outline-danger btn-sm"
                                (click)="deletePrescription(item)">

                                <i class="bi bi-trash"></i>

                            </button>

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>
