<div class="page-header">

    <div>

        <h2>

            <i class="bi bi-calendar-plus-fill text-primary"></i>

            Add Appointment

        </h2>

        <p class="text-muted">

            Schedule a new appointment

        </p>

    </div>

</div>

<div class="card shadow-sm">

    <div class="card-body">

        <form
            [formGroup]="appointmentForm"
            (ngSubmit)="save()">

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label class="form-label">

                        Patient

                    </label>

                    <select
                        class="form-select"
                        formControlName="patientId">

                        <option [ngValue]="null">

                            Select Patient

                        </option>

                        <option
                            *ngFor="let patient of patients"
                            [value]="patient.id">

                            {{patient.firstName}} {{patient.lastName}}

                        </option>

                    </select>

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">

                        Doctor

                    </label>

                    <select
                        class="form-select"
                        formControlName="doctorId">

                        <option [ngValue]="null">

                            Select Doctor

                        </option>

                        <option
                            *ngFor="let doctor of doctors"
                            [value]="doctor.id">

                            {{doctor.name}}

                        </option>

                    </select>

                </div>

            </div>

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label class="form-label">

                        Appointment Date

                    </label>

                    <input
                        type="datetime-local"
                        class="form-control"
                        formControlName="appointmentDate">

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">

                        Visit Type

                    </label>

                    <select
                        class="form-select"
                        formControlName="visitType">

                        <option value="">

                            Select Visit Type

                        </option>

                        <option>Consultation</option>

                        <option>Follow-up</option>

                        <option>Routine Checkup</option>

                        <option>Emergency</option>

                        <option>Vaccination</option>

                    </select>

                </div>

            </div>

            <div class="mb-3">

                <label class="form-label">

                    Notes

                </label>

                <textarea
                    rows="3"
                    class="form-control"
                    formControlName="notes">

                </textarea>

            </div>

            <div class="mb-3">

                <label class="form-label">

                    Diagnosis

                </label>

                <textarea
                    rows="3"
                    class="form-control"
                    formControlName="diagonosis">

                </textarea>

            </div>

            <hr>

            <div class="text-end">

                <button
                    type="button"
                    class="btn btn-secondary me-2"
                    (click)="cancel()">

                    <i class="bi bi-x-circle"></i>

                    Cancel

                </button>

                <button
                    type="submit"
                    class="btn btn-primary">

                    <i class="bi bi-check-circle"></i>

                    Save Appointment

                </button>

            </div>

        </form>

    </div>

</div>
